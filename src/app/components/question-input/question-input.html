<section class="question-container">
  <h2>Ask a RAG question</h2>
  <textarea
    [(ngModel)]="question"
    placeholder="Type your question here..."
    rows="4" cols="50">
  </textarea>
  <br>
  <button
    [disabled]="loading() || question.trim().length === 0"
    (click)="sendQuestion()">{{ loading() ? 'Processing...' : 'Send Question' }}
  </button>
</section>
