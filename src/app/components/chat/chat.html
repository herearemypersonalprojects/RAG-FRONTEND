
<div class="chat-container">

  <section>
    <p>Version: {{ getServiceVersion() }}</p>
  </section>

  <app-question-input
    (questionSubmitted)="onQuestionSubmitted($event)">
  </app-question-input>

  @if (answer) {

  <app-answer-display
    [answer]="answer">
  </app-answer-display>

  }

  @if (lastQuestion) {
    <app-question-display
      [lastQuestion]="lastQuestion">
    </app-question-display>
  }
</div>
